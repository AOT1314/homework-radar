name: deadline-reminder

on:
  schedule:
    # 北京时间 08:20 / 08:40 / 09:00，三个时间点互为备份
    # GitHub 的定时触发经常延迟甚至整次漏掉，所以多挂几个；脚本内部按天去重，只会推一次
    - cron: '20 0 * * *'
    - cron: '40 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deadline-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Send deadline reminder
        env:
          RADAR_SPACE: ${{ vars.RADAR_SPACE }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: node scripts/notify-cloud.mjs
